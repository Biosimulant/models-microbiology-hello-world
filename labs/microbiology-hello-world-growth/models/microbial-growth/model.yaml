schema_version: "2.0"
title: "Microbiology Hello World Growth Simulator"
description: "Beginner-friendly microbial growth model that consumes a setup record, simulates viable cells eating food, growing, and declining after starvation."
standard: other
tags:
  - microbiology
  - tutorial
  - hello-world
  - population-growth
authors:
  - "Biosimulant Team"
biosim:
  entrypoint: "src.microbial_growth:MicrobialGrowthHelloWorld"
  communication_step: 0.25
parameters:
  - name: initial_cells
    value: 10.0
    min: 0.0
    units: "cells"
    description: "Starting number of cells."
  - name: available_food
    value: 80.0
    min: 0.0
    units: "food_unit"
    description: "Food units available at the start of the run."
  - name: growth_rate
    value: 0.8
    min: 0.0
    units: "1/hour"
    description: "Maximum fractional growth rate when food and space are available."
  - name: space_limit
    value: 200.0
    min: 1.0
    units: "cells"
    description: "Approximate maximum cell count the environment can hold."
  - name: integration_step
    value: 0.05
    min: 0.0
    units: "hour"
    description: "Internal simulation step used while advancing the colony."
  - name: food_per_new_cell
    value: 1.0
    min: 0.0
    units: "food_unit/cell"
    description: "Food consumed for each new cell added by the growth step."
  - name: starvation_death_rate
    value: 0.04
    min: 0.0
    units: "1/hour"
    description: "First-order viable-cell loss rate after food is exhausted."
io:
  inputs:
    - name: growth_setup
      description: "Record from the starter-culture model with initial_cells, available_food, growth_rate, space_limit, and food_per_new_cell."
  outputs:
    - name: colony_state
      emitted_unit: "cells"
      description: "Current viable colony size, food remaining, starvation loss, and limiting phase."
    - name: lesson_summary
      description: "Plain-language summary of the run."
